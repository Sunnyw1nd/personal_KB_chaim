[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wechat-html-normalizer"
version = "0.4.0"
description = "Offline normalizer for recognized WeChat and Zhihu column saved HTML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "charset-normalizer>=3.3,<4",
  "lxml>=5,<7",
  "Pillow>=10,<13",
  "pydantic>=2.7,<3",
  "markdown-it-py>=3.0,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
annotation = ["openpyxl>=3.1.5,<4"]
enrichment = ["openai>=2.14,<3", "openpyxl>=3.1.5,<4"]
workbench = ["Flask>=3.1,<4", "openai>=2.14,<3"]

[project.scripts]
wechat-normalize = "wechat_html_normalizer.cli:main"
kb-normalize = "wechat_html_normalizer.cli:main"
kb-enrich-images = "wechat_html_normalizer.enrichment.cli:main"
kb-workbench = "wechat_html_normalizer.workbench.server:main"

[tool.setuptools.package-data]
"wechat_html_normalizer.enrichment" = ["prompts/*.md", "observer_assets/*.css", "observer_assets/*.js"]
"wechat_html_normalizer.workbench" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "real_sample: regression test requiring immutable externally supplied saved-HTML samples",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".work", "output", "samples", "test_pictures"]
